<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projector Output</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    display: flex; gap: 8px; font-family: sans-serif;
  }
  #controls button {
    background: rgba(255,255,255,0.12); color: #ccc; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer;
  }
  #controls button:hover { background: rgba(255,255,255,0.25); }
  #controls.calibrating button { color: #fff; }
</style>
</head>
<body>
<div id="controls">
  <button id="calibrateBtn">Calibrate</button>
  <button id="saveCalBtn" hidden>Save alignment</button>
  <button id="resetCalBtn" hidden>Reset</button>
</div>
<canvas id="canvas"></canvas>
<script src="homography.js"></script>
<script src="project.js"></script>
</body>
</html>
